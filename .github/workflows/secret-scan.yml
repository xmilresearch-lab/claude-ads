name: secret-scan

on:
  push:
  pull_request:

# Full-history secret scan on every push and PR; a finding fails the job.
# Run gitleaks directly (its official container) rather than gitleaks-action@v2,
# which requires a paid GITLEAKS_LICENSE for organization-owned repos.
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks full-history scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --config=/repo/.gitleaks.toml \
            --log-opts=--all --redact --no-banner --exit-code 1
