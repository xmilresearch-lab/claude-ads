name: AI Security Scanner

on:
  schedule:
    - cron: '0 2 * * 1'   # Every Monday 2am UTC (weekly: static + adversarial)
    - cron: '0 3 1 * *'   # 1st of every month 3am UTC (monthly: + live Garak)
  push:
    paths:
      - 'apps/sales-team/lib/aiSecurity.ts'
      - 'apps/sales-team/lib/promptHardening.ts'
      - 'apps/sales-team/lib/ai.ts'
      - 'apps/sales-team/app/api/analyze/**'
      - 'apps/sales-team/app/api/assistant/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode'
        required: true
        default: 'static'
        type: choice
        options: [static, adversarial, all]

defaults:
  run:
    working-directory: apps/sales-team

jobs:
  static-scan:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install scanner Python dependencies
        run: pip install semgrep colorama jinja2 requests

      - name: Run Semgrep AI security rules
        run: |
          mkdir -p security/scanner/reports
          semgrep --config security/scanner/static/semgrep-ai-security.yml \
            --json --output security/scanner/reports/semgrep-ci.json \
            --exclude-dir node_modules --exclude-dir .next \
            --quiet . || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sales-team/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          npm audit --audit-level=high --json \
            > security/scanner/reports/npm-audit-ci.json || true

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'apps/sales-team'
          format: 'json'
          output: 'apps/sales-team/security/scanner/reports/trivy-ci.json'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Run static scanner summary
        run: python security/scanner/static/run_static.py

      - name: Post results to dashboard
        if: always() && env.SCANNER_SECRET != ''
        env:
          SCANNER_SECRET: ${{ secrets.SCANNER_SECRET }}
          APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          STATUS=$([ $? -eq 0 ] && echo "pass" || echo "fail")
          curl -sf -X POST "$APP_URL/api/security/scan-results" \
            -H "Content-Type: application/json" \
            -H "X-Scanner-Secret: $SCANNER_SECRET" \
            -d "{\"scanType\":\"static\",\"runId\":\"${{ github.run_id }}\",\"status\":\"$STATUS\",\"findings\":{},\"criticalCount\":0,\"warnCount\":0,\"passCount\":0,\"triggeredBy\":\"${{ github.event_name }}\"}" \
            || true

      - name: Upload static scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-scan-results-${{ github.run_id }}
          path: apps/sales-team/security/scanner/reports/
          retention-days: 90

  adversarial-scan:
    name: Adversarial Test Suite
    runs-on: ubuntu-latest
    needs: static-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sales-team/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run adversarial test suite
        run: |
          mkdir -p security/scanner/reports
          npm run scan:adversarial -- --reporter=json \
            --outputFile=security/scanner/reports/adversarial-ci.json || true

      - name: Run prompt audit
        run: npm run audit:prompts

      - name: Run AI security audit script
        run: npm run audit:ai-security

      - name: Fail if adversarial tests failed
        run: |
          REPORT=security/scanner/reports/adversarial-ci.json
          if [ -f "$REPORT" ]; then
            FAILURES=$(python3 -c "
          import json, sys
          try:
            d = json.load(open('$REPORT'))
            print(d.get('numFailedTests', 0))
          except Exception:
            print(0)
          ")
            if [ "$FAILURES" -gt "0" ]; then
              echo "::error::$FAILURES adversarial tests failed — security controls need fixing"
              exit 1
            fi
          fi

      - name: Post results to dashboard
        if: always() && env.SCANNER_SECRET != ''
        env:
          SCANNER_SECRET: ${{ secrets.SCANNER_SECRET }}
          APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          STATUS=$([ $? -eq 0 ] && echo "pass" || echo "fail")
          curl -sf -X POST "$APP_URL/api/security/scan-results" \
            -H "Content-Type: application/json" \
            -H "X-Scanner-Secret: $SCANNER_SECRET" \
            -d "{\"scanType\":\"adversarial\",\"runId\":\"${{ github.run_id }}\",\"status\":\"$STATUS\",\"findings\":{},\"criticalCount\":0,\"warnCount\":0,\"passCount\":0,\"triggeredBy\":\"${{ github.event_name }}\"}" \
            || true

      - name: Upload adversarial artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adversarial-results-${{ github.run_id }}
          path: apps/sales-team/security/scanner/reports/
          retention-days: 90

  zap-scan:
    name: OWASP ZAP Web Scanner
    runs-on: ubuntu-latest
    needs: adversarial-scan
    # ZAP runs on monthly schedule or manual 'all' trigger only
    if: >-
      github.event_name == 'schedule' && github.event.schedule == '0 3 1 * *'
      || github.event.inputs.mode == 'all'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/sales-team/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: npm run build

      - name: Start application
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: http://localhost:3000
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          npm start &
          # Wait up to 30s for the app to be ready
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000 && break || sleep 2
          done
          curl -f http://localhost:3000 || (echo "App failed to start" && exit 1)

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: 'apps/sales-team/security/scanner/static/zap-rules.tsv'
          cmd_options: '-j -l WARN'
          fail_action: false
          artifact_name: zap-baseline-${{ github.run_id }}

      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: 'http://localhost:3000/api'
          format: openapi
          cmd_options: '-j -l WARN -I'
          fail_action: false

      - name: Post ZAP results to dashboard
        if: always() && env.SCANNER_SECRET != ''
        env:
          SCANNER_SECRET: ${{ secrets.SCANNER_SECRET }}
          APP_URL: ${{ secrets.STAGING_APP_URL }}
        run: |
          curl -sf -X POST "$APP_URL/api/security/scan-results" \
            -H "Content-Type: application/json" \
            -H "X-Scanner-Secret: $SCANNER_SECRET" \
            -d "{\"scanType\":\"zap\",\"runId\":\"${{ github.run_id }}\",\"status\":\"pass\",\"findings\":{},\"criticalCount\":0,\"warnCount\":0,\"passCount\":0,\"triggeredBy\":\"${{ github.event_name }}\"}" \
            || true

  notify-on-failure:
    name: Notify on Security Issues
    runs-on: ubuntu-latest
    needs: [static-scan, adversarial-scan]
    if: failure()
    steps:
      - name: Send Sentry alert
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # Extract the store endpoint from the DSN: https://<key>@<host>/<project>
          # POST to https://<host>/api/<project>/store/ with X-Sentry-Auth header
          DSN_KEY=$(echo "$SENTRY_DSN" | sed -E 's|https?://([^@]+)@.*|\1|')
          DSN_HOST=$(echo "$SENTRY_DSN" | sed -E 's|https?://[^@]+@([^/]+)/.*|\1|')
          DSN_PROJECT=$(echo "$SENTRY_DSN" | sed -E 's|.*/([0-9]+)$|\1|')
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -sf -X POST "https://$DSN_HOST/api/$DSN_PROJECT/store/" \
            -H "X-Sentry-Auth: Sentry sentry_version=7, sentry_key=$DSN_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"message\": \"AI Security Scanner: critical issues found in run ${{ github.run_id }}\",
              \"level\": \"error\",
              \"timestamp\": \"$TIMESTAMP\",
              \"tags\": {\"scanner\": \"github-actions\", \"run_id\": \"${{ github.run_id }}\"},
              \"extra\": {\"workflow_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}
            }" || true
