name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  lint:
    name: Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/pyproject.toml') }}
      - run: pip install ruff mypy
      - run: ruff check backend/app/
      - run: mypy backend/app/ --ignore-missing-imports

  security-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/pyproject.toml') }}
      - name: Install package
        working-directory: backend
        run: pip install -e ".[test]"
      - run: pip install pip-audit
      - name: Audit for HIGH/CRITICAL CVEs
        working-directory: backend
        run: pip-audit --fail-on HIGH

  test:
    name: Test Suite (Unit + Integration)
    runs-on: ubuntu-latest
    needs: [lint]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports: ["6379:6379"]

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SECRET_KEY: test-secret-key-minimum-32-characters-long
      ENCRYPTION_KEY: test-encryption-key-32-characters-long
      MCP_AUTH_TOKEN: test-mcp-token
      SOCIAL_MCP_URL: http://localhost:3001/mcp
      EMAIL_MCP_URL: http://localhost:3002/mcp
      CRM_MCP_URL: http://localhost:3003/mcp
      ALLOWED_ORIGINS: http://localhost:3000
      WEBHOOK_SECRET: test-webhook-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/pyproject.toml') }}
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[test]"
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "❌ ANTHROPIC_API_KEY secret is not set."
            echo "   Go to: Settings → Secrets and variables → Actions"
            echo "   Add secret: ANTHROPIC_API_KEY"
            exit 1
          fi
          echo "✅ ANTHROPIC_API_KEY is set"
      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: |
          pytest tests/unit/ tests/integration/ tests/contract/ tests/security/ \
            --cov=app --cov-fail-under=83 \
            --cov-report=xml:coverage.xml \
            -v --tb=short  # Threshold matches pyproject.toml — raised to 90 once providers.py tests land
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml

  build:
    name: Build + Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:latest
            ghcr.io/${{ github.repository }}/worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production   # requires manual approval in GitHub

    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/automation-platform
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec -T api \
              alembic upgrade head
            docker system prune -f
            echo "Deploy complete: $(date)"

      - name: Smoke Test Production
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.PROD_DOMAIN }}/health)
          if [ "$STATUS" != "200" ]; then
            echo "SMOKE TEST FAILED: /health returned $STATUS"
            exit 1
          fi
          READY=$(curl -s https://${{ secrets.PROD_DOMAIN }}/health/ready \
            | python -c "import sys,json; d=json.load(sys.stdin); \
              print(d.get('status','unknown'))")
          echo "Production status: $READY"
