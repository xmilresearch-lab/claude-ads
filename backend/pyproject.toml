[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-automation-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "pydantic>=2.0",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "httpx",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "croniter",
    "cryptography>=46.0.5",  # CVE-2023-50782, CVE-2024-0727, CVE-2026-26007 fixed in 46.0.5
    "anthropic>=0.40.0",
    "slowapi>=0.1.9",
    "limits[redis]>=3.6",
    "secure>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "faker>=24.0",
    "locust>=2.24",
    "respx>=0.21",
    "freezegun>=1.4",
    "factory-boy>=3.3",
    "pip-audit",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line length enforced by Black, not ruff
    "UP046",  # Generic[T] → T syntax requires unsafe Pydantic BaseModel changes
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disable_error_code = [
    "misc",             # pydantic BaseModel subclass typing gap
    "untyped-decorator",  # SlowAPI @limiter.limit() lacks py.typed stubs
    "import-untyped",   # croniter ships no stubs
    "type-arg",         # bare dict/list annotations — cosmetic
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
