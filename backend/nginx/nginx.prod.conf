events {
    worker_connections 1024;
}

http {
    # ── Rate limiting zones ───────────────────────────────────────────────────
    # These complement (not replace) slowapi rate limits in the API layer.
    limit_req_zone $binary_remote_addr zone=api:10m  rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # ── Upstream (least-conn balances across api replicas) ───────────────────
    upstream api_backend {
        least_conn;
        server api:8000;
        keepalive 32;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com;

        # TLS certificates (managed externally — e.g. certbot / Let's Encrypt)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern TLS only
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers (backup to app-level headers) ───────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    nosniff                                       always;
        add_header X-Frame-Options           DENY                                          always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"             always;

        # ── Request limits ────────────────────────────────────────────────────
        client_max_body_size  10M;
        client_body_timeout   30s;
        client_header_timeout 10s;

        # ── Proxy defaults shared by all locations ────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # ── Webhook endpoints ─────────────────────────────────────────────────
        # Higher burst — webhooks from external providers can arrive in batches.
        # Longer read timeout — Celery task dispatch may take up to 30s.
        location /webhooks/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass         http://api_backend;
            proxy_read_timeout 30s;
        }

        # ── Auth endpoints — strict rate limiting ─────────────────────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass         http://api_backend;
            proxy_read_timeout 15s;
        }

        # ── All other API endpoints ───────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass         http://api_backend;
            proxy_read_timeout 60s;
        }

        # ── Health probe — no rate limit, suppress access log noise ──────────
        location /health {
            proxy_pass    http://api_backend;
            proxy_read_timeout 5s;
            access_log    off;
        }

        # ── Block OpenAPI docs in production ──────────────────────────────────
        # Remove these three rules if you want to expose the docs externally.
        location /docs        { return 404; }
        location /redoc       { return 404; }
        location /openapi.json { return 404; }
    }
}
