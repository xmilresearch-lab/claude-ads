/* ---- Utilities ---- */
function usdToTokenAmount(usd, token) {
  if (token.id==="ETH") {
    const eth=usd/RATES.ETH;
    const wei=BigInt(Math.round(eth*1e15))*BigInt(1000);
    return {display:eth.toFixed(6)+" ETH", hex:"0x"+wei.toString(16)};
  }
  if (token.id==="BTC") return {display:(usd/RATES.BTC).toFixed(8)+" BTC"};
  if (token.id==="XRP") return {display:(usd/RATES.XRP).toFixed(4)+" XRP"};
  if (token.decimals===6) {
    const raw=Math.round(usd*1e6);
    return {display:usd.toFixed(2)+" "+token.symbol, hex:"0x"+raw.toString(16)};
  }
  const raw=BigInt(Math.round(usd*1e16))*BigInt(100);
  return {display:usd.toFixed(2)+" "+token.symbol, hex:"0x"+raw.toString(16)};
}
function encodeERC20Transfer(to, amountHex) {
  return "0x"+"a9059cbb"+to.replace("0x","").toLowerCase().padStart(64,"0")+amountHex.replace("0x","").padStart(64,"0");
}
async function sendEVMPayment(token, amountHex, from) {
  if (token.id==="ETH")
    return window.ethereum.request({method:"eth_sendTransaction",params:[{from,to:EVM_RECEIVER,value:amountHex,gas:"0x5208"}]});
  const data=encodeERC20Transfer(EVM_RECEIVER, amountHex);
  return window.ethereum.request({method:"eth_sendTransaction",params:[{from,to:token.contract,data,gas:"0x30D40"}]});
}
function shortAddr(a){return a?a.slice(0,6)+"…"+a.slice(-4):""}
function clip(text){try{navigator.clipboard.writeText(text)}catch(e){const t=document.createElement("textarea");t.value=text;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);}}

/* ---- useWallet ---- */
function useWallet() {
  const [wallet,setWallet]=useState({connected:false,address:null,chainId:null});
  const update=useCallback((accs,chainId)=>{
    if(accs&&accs.length>0) setWallet({connected:true,address:accs[0],chainId});
    else setWallet({connected:false,address:null,chainId:null});
  },[]);
  const connect=useCallback(async()=>{
    if(!window.ethereum) return {error:"no_metamask"};
    try {
      const accs=await window.ethereum.request({method:"eth_requestAccounts"});
      const chainId=await window.ethereum.request({method:"eth_chainId"});
      update(accs,chainId); return {address:accs[0],chainId};
    } catch(err){return {error:err.code===4001?"user_rejected":"failed"};}
  },[update]);
  const disconnect=useCallback(()=>setWallet({connected:false,address:null,chainId:null}),[]);
  useEffect(()=>{
    const eth=window.ethereum; if(!eth) return;
    eth.request({method:"eth_accounts"}).then(accs=>{
      if(accs.length>0) eth.request({method:"eth_chainId"}).then(id=>update(accs,id));
    }).catch(()=>{});
    const onAcc=accs=>update(accs,null);
    const onChain=id=>setWallet(w=>({...w,chainId:id}));
    eth.on("accountsChanged",onAcc); eth.on("chainChanged",onChain);
    return()=>{eth.removeListener("accountsChanged",onAcc);eth.removeListener("chainChanged",onChain);};
  },[update]);
  return {wallet,connect,disconnect};
}

      const m=new THREE.Mesh(geo,bMat); m.position.set(x,h/2,z); scene.add(m);
      const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xFF6500,transparent:true,opacity:.22}));
      e.position.copy(m.position); scene.add(e);
    });
    const rMat=new THREE.LineBasicMaterial({color:0xFF6500,transparent:true,opacity:.65});
    const routes=[
      [new THREE.Vector3(-18,.06,0),new THREE.Vector3(18,.06,0)],
      [new THREE.Vector3(0,.06,-18),new THREE.Vector3(0,.06,18)],
      [new THREE.Vector3(-14,.06,-8),new THREE.Vector3(14,.06,8)],
      [new THREE.Vector3(-12,5,-4),new THREE.Vector3(12,5,4)],
    ];
    routes.forEach(pts=>scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),rMat)));
    const podGeo=new THREE.SphereGeometry(.22,8,8), podMat=new THREE.MeshBasicMaterial({color:0xFF6500});
    const pods=routes.map(pts=>{
      const p=new THREE.Mesh(podGeo,podMat);
      p.userData={pts,t:Math.random(),speed:.003+Math.random()*.004,dir:Math.random()>.5?1:-1};
      scene.add(p); return p;
    });
    const PC=900, pPos=new Float32Array(PC*3);
    for(let i=0;i<PC;i++){pPos[i*3]=(Math.random()-.5)*70;pPos[i*3+1]=Math.random()*30+.5;pPos[i*3+2]=(Math.random()-.5)*70;}
    const pGeo=new THREE.BufferGeometry(); pGeo.setAttribute("position",new THREE.BufferAttribute(pPos,3));
    const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:0xFF7A20,size:.07,transparent:true,opacity:.45}));
    scene.add(particles);
    let mx=0,my=0;
    const onMove=e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;};
    window.addEventListener("mousemove",onMove);
    const onResize=()=>{const nw=el.clientWidth,nh=el.clientHeight;renderer.setSize(nw,nh);camera.aspect=nw/nh;camera.updateProjectionMatrix();};
    window.addEventListener("resize",onResize);
    let t=0,raf;
    const tick=()=>{
      raf=requestAnimationFrame(tick); t+=.01;
      oP.intensity=5+Math.sin(t*1.8)*1.2;
      pods.forEach(p=>{
        p.userData.t+=p.userData.speed*p.userData.dir;
        if(p.userData.t>=1){p.userData.t=1;p.userData.dir=-1;}
        if(p.userData.t<=0){p.userData.t=0;p.userData.dir=1;}
        p.position.lerpVectors(p.userData.pts[0],p.userData.pts[1],p.userData.t);
      });
      particles.rotation.y+=.00025;
      camera.position.x+=(28+mx*5-camera.position.x)*.04;
      camera.position.y+=(20-my*4-camera.position.y)*.04;
      camera.lookAt(0,2,0); renderer.render(scene,camera);
    };
    tick();
    return()=>{
      cancelAnimationFrame(raf);
      window.removeEventListener("mousemove",onMove);
      window.removeEventListener("resize",onResize);
      renderer.dispose();
      if(el.contains(renderer.domElement)) el.removeChild(renderer.domElement);
    };
  },[]);
}

function useReveal(){
  useEffect(()=>{
    const els=document.querySelectorAll(".reveal");
    const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("vis");io.unobserve(e.target);}}),{threshold:.12});
    els.forEach(el=>io.observe(el)); return()=>io.disconnect();
  },[]);
}

/* ---- MockQR ---- */
function MockQR({seed="x",size=130}){
  const cells=17;
  const hash=seed.split("").reduce((a,c,i)=>(a+c.charCodeAt(0)*(i+1))|0,0);
  const isDark=(r,c)=>{
    if(r<7&&c<7) return r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4);
    if(r<7&&c>=cells-7){const lc=c-(cells-7);return r===0||r===6||lc===0||lc===6||(r>=2&&r<=4&&lc>=2&&lc<=4);}
    if(r>=cells-7&&c<7){const lr=r-(cells-7);return lr===0||lr===6||c===0||c===6||(lr>=2&&lr<=4&&c>=2&&c<=4);}
    return((r*13+c*7+hash+r*c)%3)!==0;
  };
  const cp=(size-16)/cells;
  return(
    <div style={{background:"#fff",padding:8,borderRadius:10,display:"inline-block",boxShadow:"0 4px 24px rgba(0,0,0,.5)"}}>
      <div style={{display:"grid",gridTemplateColumns:`repeat(${cells},${cp}px)`,gridTemplateRows:`repeat(${cells},${cp}px)`}}>
        {Array.from({length:cells*cells},(_,i)=>{
          const r=Math.floor(i/cells),c=i%cells;
          return <div key={i} style={{background:isDark(r,c)?"#0a0a0a":"#fff"}}/>;
        })}
      </div>
    </div>
  );
}

                <span style={{fontSize:".58rem",fontWeight:700,letterSpacing:".22em",textTransform:"uppercase",color:T.accent}}>{e.tag}</span>
                <p style={{fontSize:".95rem",color:T.secondary,lineHeight:1.7,marginTop:14}}>{e.title}</p>
                <div style={{marginTop:20,display:"flex",alignItems:"center",gap:6,color:T.accent}}><span style={{fontSize:".75rem",fontWeight:600}}>Learn more</span><ArrowRight size={13}/></div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* PRICING */}
      <PricingSection onSelectPlan={plan=>openPM(plan)}/>

      {/* TESTIMONIAL */}
      <section style={{padding:"clamp(6rem,12vw,13rem) clamp(1.5rem,5vw,5rem)",maxWidth:1280,margin:"0 auto",textAlign:"center"}}>
        <div className="reveal">
          <span className="section-tag" style={{display:"inline-block"}}>Community</span>
          <blockquote style={{fontFamily:"Orbitron,sans-serif",fontSize:"clamp(1.5rem,3.5vw,3rem)",fontWeight:700,letterSpacing:"-.02em",lineHeight:1.15,maxWidth:"22ch",margin:"0 auto 36px"}}>“Finally an app that makes life feel like a <span className="orange-grad">boss battle.”</span></blockquote>
          <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:12}}>
            <div style={{width:44,height:44,borderRadius:"50%",background:`linear-gradient(135deg,${T.accent},${T.accentAlt})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.1rem"}}>&#x26A1;</div>
            <div style={{textAlign:"left"}}><div style={{fontWeight:600,fontSize:".9rem"}}>xNova_7</div><div style={{color:T.muted,fontSize:".75rem"}}>Rank #1 · San Francisco</div></div>
          </div>
        </div>
      </section>

      {/* CTA */}
      <section style={{position:"relative",overflow:"hidden",padding:"clamp(7rem,14vw,14rem) clamp(1.5rem,5vw,5rem)",textAlign:"center",background:T.bgSurface,borderTop:`1px solid ${T.border}`}}>
        <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:700,height:700,borderRadius:"50%",background:"radial-gradient(circle,rgba(255,101,0,.07) 0%,transparent 70%)",filter:"blur(50px)",pointerEvents:"none"}}/>
        <div className="reveal">
          <span className="section-tag" style={{display:"inline-block"}}>Join the Game</span>
          <h2 style={{fontFamily:"Orbitron,sans-serif",fontSize:"clamp(3rem,8vw,8rem)",fontWeight:900,letterSpacing:"-.04em",lineHeight:.88,marginBottom:28}}>READY TO<br/><span className="orange-grad">LEVEL UP?</span></h2>
          <p style={{color:T.secondary,fontSize:"clamp(.95rem,1.8vw,1.1rem)",maxWidth:"46ch",margin:"0 auto 42px",lineHeight:1.8}}>Join 2.4 million players turning ordinary life into an extraordinary adventure. Pay with crypto. Play forever.</p>
          <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap"}}>
            <button className="btn-acc" style={{fontSize:".95rem",padding:"17px 40px"}} onClick={()=>openPM()}>Subscribe with Crypto <ArrowRight size={17}/></button>
            <button className="btn-ghost" style={{fontSize:".95rem",padding:"17px 40px"}}>View Roadmap</button>
          </div>
          <div style={{display:"flex",gap:12,justifyContent:"center",marginTop:28,flexWrap:"wrap"}}>
            {["App Store ★ 4.97","Google Play ★ 4.96"].map((b,i)=>(<div key={i} style={{padding:"8px 20px",borderRadius:8,background:T.bgRaised,border:`1px solid ${T.border}`,fontSize:".78rem",color:T.secondary,fontWeight:500}}>{b}</div>))}
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer style={{borderTop:`1px solid ${T.border}`}}>
        <div className="footer-grid" style={{maxWidth:1280,margin:"0 auto",padding:"clamp(4rem,8vw,8rem) clamp(1.5rem,5vw,5rem) clamp(2rem,4vw,4rem)",display:"grid",gridTemplateColumns:"2fr repeat(3,1fr)",gap:48}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
              <div style={{width:34,height:34,borderRadius:8,background:`linear-gradient(135deg,${T.accent},${T.accentAlt})`,boxShadow:glowSm,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontFamily:"Orbitron,sans-serif",fontWeight:900,fontSize:".85rem",color:"#07090B"}}>G</span></div>
              <span style={{fontFamily:"Orbitron,sans-serif",fontWeight:700,fontSize:".95rem",letterSpacing:".04em"}}>game<span style={{color:T.accent}}>fi</span>lyfe</span>
            </div>
            <p style={{color:T.muted,fontSize:".875rem",lineHeight:1.75,maxWidth:"28ch"}}>The world's first gamified lifestyle super app. Pay with crypto. Level up your life, every day.</p>
          </div>
          {[{title:"Product",links:["Features","Roadmap","Changelog","Pricing"]},{title:"Community",links:["Discord","Twitter","Reddit","Leaderboard"]},{title:"Company",links:["About","Blog","Careers","Press"]}].map(col=>(
            <div key={col.title}>
              <div style={{fontSize:".62rem",fontWeight:700,letterSpacing:".2em",textTransform:"uppercase",color:T.muted,marginBottom:22}}>{col.title}</div>
              {col.links.map(link=>(<a key={link} href="#" style={{display:"block",color:T.secondary,textDecoration:"none",fontSize:".88rem",marginBottom:13,transition:"color .2s"}} onMouseEnter={e=>e.target.style.color=T.primary} onMouseLeave={e=>e.target.style.color=T.secondary}>{link}</a>))}
            </div>
          ))}
        </div>
        <div style={{borderTop:`1px solid ${T.border}`,padding:"18px clamp(1.5rem,5vw,5rem)",maxWidth:1280,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
          <span style={{fontSize:".72rem",color:T.muted}}>&copy; 2026 GamefiLyfe Inc. All rights reserved.</span>
          <div style={{display:"flex",gap:22}}>{["Privacy","Terms","Cookies"].map(item=>(<a key={item} href="#" style={{fontSize:".72rem",color:T.muted,textDecoration:"none"}}>{item}</a>))}</div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
